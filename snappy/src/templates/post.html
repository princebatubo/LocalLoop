<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      max-width: 560px;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 16px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 12px;
      background: #ddd;
      object-fit: cover;
    }

    .author-name {
      font-weight: 600;
      font-size: 15px;
      color: #050505;
    }

    .timestamp {
      font-size: 13px;
      color: #65676b;
    }

    .message {
      padding: 0 16px 16px;
      font-size: 15px;
      line-height: 1.4;
      color: #050505;
      white-space: pre-wrap;
    }

    .post-image {
      width: 100%;
      display: block;
    }

    .branding {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: #f0f2f5;
      border-top: 1px solid #e4e6ea;
    }

    .branding svg {
      width: 20px;
      height: 20px;
    }

    .branding span {
      font-size: 12px;
      color: #65676b;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img class="avatar" src="{{AUTHOR_AVATAR}}" alt="" />
      <div>
        <div class="author-name">{{AUTHOR_NAME}}</div>
        <div class="timestamp">{{TIMESTAMP}}</div>
      </div>
    </div>

    <div class="message">{{MESSAGE}}</div>

    <img class="post-image" src="{{IMAGE_URL}}" style="display:{{HAS_IMAGE}}" alt="" />

    <div class="branding">
      <svg viewBox="0 0 24 24" fill="#1877f2">
        <path d="M24 12.073c0-6.627-5.373-12-12-12S0 5.446 0 12.073c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      <span>Captured by Snappy</span>
    </div>
  </div>
</body>
</html>
